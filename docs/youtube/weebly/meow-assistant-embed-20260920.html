<template id="mx-new-template"><section class="mx-section" id="mx-new"><span class="mx-kicker">More to explore</span><h2>A little more life.<br>A world of its own.</h2><p>We’re expanding Meow with interactive habitats, new companion forms, and a more playful interface. Feature availability may vary during the beta.</p><div class="mx-features"><article class="mx-feature"><span class="mx-icon">✦</span><h3>A cartoon feel throughout.</h3><p>Bold outlined cards, clearer buttons, and warm light or deep teal surfaces bring the companion’s personality into menus, settings, chat, and setup. A simpler swipe-down card menu helps you return to your avatar.</p></article><article class="mx-feature"><span class="mx-icon">⌂</span><h3>Rooms you can play in.</h3><p>Painted habitats and 3D rooms give your companion a place to explore. Interactive books, water, and a ball bring play into the scene. New Cartoon sky nook and Cartoon space galley backgrounds keep the room quieter and less cluttered.</p></article><article class="mx-feature"><span class="mx-icon">♡</span><h3>Care at your own pace.</h3><p>Optional care adds feeding, play, and rest. Leave care off for a self-sufficient companion, or turn it on to follow food, energy, and happiness. There is no death or punishment for time away.</p></article><article class="mx-feature"><span class="mx-icon">✧</span><h3>Meet the fruit fly.</h3><p>Explore a full 3D fruit-fly companion or Lumen’s floating fruit-fly features, with animated wings and touch reactions. This is an animated companion experiment, with movement and interactions still being refined.</p></article><article class="mx-feature"><span class="mx-icon">⚙</span><h3>Make it feel like yours.</h3><p>Avatar setup now separates Look, Space, Behavior, and Animations. Adjust size, expression, and playfulness, choose a habitat, and revisit saved performances. Scale your companion up to 300%.</p></article><article class="mx-feature"><span class="mx-icon">⌁</span><h3>Explore neural behavior.</h3><p>Try different companion behavior modes, including an experimental neural option inspired by fruit-fly movement.</p></article></div><p class="mx-note">Meow is in beta, with more companion features on the way.</p><p><a href="https://www.youtube.com/channel/UCjxT_IHbJ9OsysxHW1QxiqA">Watch Meow on YouTube ↗</a> · <a href="/projects.html">Explore our projects ↗</a></p></section></template><script>(function(){function add(){var root=document.querySelector('#meow-experience main'),t=document.getElementById('mx-new-template');if(!root||!t||document.getElementById('mx-new'))return;var anchor=root.querySelector('#mx-launcher');root.insertBefore(t.content.cloneNode(true),anchor||root.firstChild);}add();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add,{once:true});})();</script>
<template id="mx-release152-template"><section class="mx-section" id="mx-release152"><span class="mx-kicker">What’s new in Meow</span><h2>A steadier companion.<br>More ways to create.</h2><p>Explore the latest improvements to Meow’s Android beta. Join the beta group and follow Google Play for available updates.</p><div class="mx-features"><article class="mx-feature"><span class="mx-icon">✦</span><h3>Create, review, refine.</h3><p>Avatar creation now has clearer progress, retry and cancellation, plus a review dialog that works better in landscape. Keep a valid design when optional refinement fails, and equip only the result you approve. A configured generation provider is required.</p></article><article class="mx-feature"><span class="mx-icon">⌂</span><h3>Five new places to unwind.</h3><p>Explore Saffron dunes, Alpine cableway, Coral twilight, Lantern courtyard and Crystal cavern. Choose a scene to match your mood.</p></article><article class="mx-feature"><span class="mx-icon">♡</span><h3>Off means off.</h3><p>You choose when to use the microphone and camera. They stay off until you enable them, and Meow remembers your choices.</p></article><article class="mx-feature"><span class="mx-icon">✓</span><h3>See the result of a task.</h3><p>Save and preview supported small files from Computer tasks, then reopen them from Files whenever you need them.</p></article><article class="mx-feature"><span class="mx-icon">↗</span><h3>A clearer view on the road.</h3><p>A compact driving summary and scrollable details make better use of portrait and landscape space. Real alerts retain priority. Configure the app before driving; this is a companion interface, not a certified safety or emergency system.</p></article><article class="mx-feature"><span class="mx-icon">⚙</span><h3>Fewer interruptions.</h3><p>Enjoy smoother companion animation, more reliable voice interactions and improved Bluetooth handling. Help &amp; feedback makes it easier to report a problem.</p></article></div><p class="mx-note"><strong>Know your edition:</strong> the Google Play build supports app launching and drafting. Autonomous Accessibility screen control and learned screen-navigation replay are unavailable in this edition. Cloud features send relevant inputs to the provider you configure; local and cloud capabilities differ.</p><p><a href="https://groups.google.com/g/meow-assistant-beta">Join the beta group ↗</a> · <a href="https://play.google.com/apps/testing/com.meow.meowmba">Open the closed test ↗</a> · <a href="/watch.html">See Meow in action ↗</a></p></section></template><template id="mx-workflow152-template"><section class="mx-section" id="mx-verified-workflows"><span class="mx-kicker">02 / APPROVED TASKS, VISIBLE RESULTS</span><h2>Ask. Approve. See the result.</h2><p>Bring a task to your configured Computer connection, review the requested action, and inspect the result. The Play edition does not include autonomous phone-screen control or learned Accessibility navigation recipes.</p><div class="mx-features"><article class="mx-feature"><span class="mx-icon">⌕</span><h3>Start with a clear request.</h3><p>Use your connected Computer tools for a supported task. Available actions depend on the endpoint, account and tools you configure.</p></article><article class="mx-feature"><span class="mx-icon">✓</span><h3>Keep approval in your hands.</h3><p>Review action requests, approve only the scope you intend, or deny and cancel. A connection does not grant unrestricted access.</p></article><article class="mx-feature"><span class="mx-icon">▤</span><h3>Open what was actually made.</h3><p>Save and preview supported small-file results, then find the verified local copy in Files. Large exports and unified project workflows are still in development.</p></article></div></section></template><style>#meow-experience .mx-release-details{border:1px solid #35464d;border-radius:16px;padding:20px;margin:24px 0}#meow-experience .mx-release-details summary{cursor:pointer;font-weight:700;line-height:1.5}#meow-experience .mx-release-details p{margin-top:16px}#meow-experience #mx-release152{scroll-margin-top:90px}</style><script>(function(){function update(){var root=document.getElementById('meow-experience');if(!root)return;var main=root.querySelector('main'),t=document.getElementById('mx-release152-template');if(main&&t&&!root.querySelector('#mx-release152')){main.insertBefore(t.content.cloneNode(true),main.querySelector('#mx-new')||main.querySelector('#mx-launcher')||main.firstChild);}var h=Array.prototype.find.call(root.querySelectorAll('h2'),function(e){return e.textContent.indexOf('Learn the steps.')!==-1 && e.textContent.indexOf('Lose the repetition.')!==-1;});var section=h&&(h.closest('.mx-section')||h.closest('section'));var workflow=document.getElementById('mx-workflow152-template');if(section&&workflow){var fragment=workflow.content.cloneNode(true);if(section.id)fragment.firstElementChild.id=section.id;section.replaceWith(fragment);}var replacements=[["A little face. A whole new phone. Native avatar artwork · choose a background preview","A little face. A whole new phone. Choose a background preview."],["Real app GIF","See it move"],["Vector preview adapted from the app’s drawing geometry","Classic companion preview"],["Native app renderer previews.","Meet your next companion."],["native renderer animation preview","animation preview"],['AI search, phone control, and a companion','AI search, app launching, and a companion'],['Phone + computer control','Apps + approved Computer tasks'],['AI phone control can tap, swipe, type, and navigate through supported app workflows using Android Accessibility.','Open installed apps and prepare drafts from the conversation. The Google Play edition does not include autonomous Accessibility screen control.'],['Use my phone to search for birds in YouTube.','Open YouTube.'],['Phone control requires the permissions and services you enable.','Available actions depend on your edition, configured tools and permissions.'],['Say it. Let Meow act.','Launch an app. Prepare a draft.']];var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n;while(n=walker.nextNode()){if(n.parentElement&&/^(SCRIPT|STYLE)$/.test(n.parentElement.tagName))continue;var value=n.nodeValue;replacements.forEach(function(pair){value=value.split(pair[0]).join(pair[1]);});if(value!==n.nodeValue)n.nodeValue=value;}}update();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',update,{once:true});window.addEventListener('load',update,{once:true});})();</script>
